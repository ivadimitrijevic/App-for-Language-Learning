<div class="error-pop-up">
  <div class="error-content">
    <div class="cursor-pointer hover:color-gray ml-auto mt-2 mr-2">
        <span class="material-symbols-outlined hover:text-gray" (click)="closingAction.emit()">
          close
        </span>
    </div>
    <div class="flex flex-col p-6 w-[30rem] h-48 items-center">
      <span class="material-symbols-outlined text-pink text-[48px]">
        error
      </span>
      <div class="text-xl text-wrap text-center mt-8">{{ message }}</div>
    </div>
  </div>
</div>

<div class="backdrop"></div>
