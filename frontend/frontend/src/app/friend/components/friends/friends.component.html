<div class="friends-component-content">
  <div class="text-xl text-indigo font-bold mt-8">My Friends</div>
    @if (friends && friends.length) {
      <div class="flex p-4 mb-4 overflow-x-auto w-full">
        @for (friend of friends; track $index) {
          <app-friend-card [user]="friend.user.id === currentUser.id ? friend.friend : friend.user"
                           [reviewLeft]="friend.leftReview"
                           (openedReview)="openedReview.emit($event)"
          ></app-friend-card>
        }
      </div>
    } @else {
      <div class="flex flex-col text-center mt-14 mb-14">
        <div class="text-lg mb-4">You have no Friends for learning!</div>
        <div class="text-lg text-gray">Go to Learners page and find someone to practice your skills with!</div>
      </div>
    }
</div>
